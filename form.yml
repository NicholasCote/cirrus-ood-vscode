---
cluster: "cirrus"

form:
  - working_dir
  - cpu
  - memory
  - wall_time

attributes:
  working_dir:
    widget: text_field
    label: "Working directory"
    value: ""
    help: |
      Absolute path to the folder VS Code opens. Leave blank for your home
      directory. Only your home directory is mounted into the session, so this
      should be a path underneath it.
    required: false
  cpu:
    widget: number_field
    label: "CPUs"
    min: 1
    max: 8
    value: 2
    step: 1
    required: true
  memory:
    widget: number_field
    label: "Memory (GB)"
    min: 1
    max: 32
    value: 8
    step: 1
    required: true
  wall_time:
    widget: number_field
    label: "Wall time (hours)"
    min: 1
    max: 24
    value: 4
    step: 1
    required: true
